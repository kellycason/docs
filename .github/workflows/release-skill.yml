name: Release agent skill

on:
  push:
    tags:
      - power-pages-code-site-v*
      - power-platform-code-apps-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate package and tag
        shell: bash
        run: |
          node scripts/validate-skill.mjs
          case "${GITHUB_REF_NAME}" in
            power-pages-code-site-v*) skill="power-pages-code-site" ;;
            power-platform-code-apps-v*) skill="power-platform-code-apps" ;;
            *) echo "Unsupported skill tag ${GITHUB_REF_NAME}." >&2; exit 1 ;;
          esac
          version="$(tr -d '[:space:]' < "skills/${skill}/VERSION")"
          expected="${skill}-v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}." >&2
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          mkdir -p release
          for skill in power-pages-code-site power-platform-code-apps; do
            cp -R "skills/${skill}" "release/${skill}"
            (
              cd release
              zip -r "../${skill}.zip" "${skill}"
            )
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            power-pages-code-site.zip
            power-platform-code-apps.zip
          generate_release_notes: true
